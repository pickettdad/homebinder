# Stage 0 — build the native shell and upload to TestFlight (PLAN-STAGE-0 §5).
#
# Manual trigger ONLY: macOS runner minutes bill ~10x, so this never runs per-push. The
# existing ubuntu CI (ci.yml) is untouched — this is a separate, opt-in pipeline.
#
# Hello-shell milestone: COMPLETE (2026-07-24) — signing proven end to end, installed on the
# owner's iPad. This build now also carries the Stage 0 RoomPlan native plugin.
#
# The iOS project is GENERATED on the runner (`cap add ios`) rather than committed — the owner
# has no Mac to generate/commit one. The RoomPlan Swift therefore lives in `native/ios/` and is
# INJECTED into the generated project below (copied in + storyboard repointed at our plugin-
# registering view controller), instead of the plan's original "commit ios/" step, which a
# no-Mac setup can't do.
#
# Required repo secrets (see docs/STAGE-0-OWNER-SETUP.md):
#   ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8 (full .p8 contents) · APPLE_TEAM_ID
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps + build the web bundle
        env:
          # The native shell's own web origin is capacitor://localhost, which has no serverless
          # functions. The bundle must therefore call the Netlify origin directly. Without this,
          # API_BASE falls back to same-origin "/api" → capacitor://localhost/api/chat → the AI
          # assistant silently never reaches the function (it just sits on "Thinking…"). Override
          # via the repo Actions VARIABLE `HS_API_BASE` if the site URL differs from the default.
          VITE_API_BASE: ${{ vars.HS_API_BASE || 'https://housesteady.netlify.app/api' }}
        run: |
          echo "Building native bundle against API base: ${VITE_API_BASE}"
          npm ci
          npm run build

      - name: Pin Xcode 26 (image default drifts weekly)
        run: |
          # Prefer a pinned 26.x; fall back to whatever 26 the image ships.
          APP="/Applications/Xcode_26.5.app"
          if [ ! -d "$APP" ]; then APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"; fi
          echo "Using $APP"
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version

      - name: Generate + sync the iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          # WKWebView crashes on the PWA's camera/mic use without these usage strings.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Photograph inspection findings, nameplates, and rooms.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Record audio evidence and dictate notes.'" "$PLIST" || true
          # The app uses only OS-standard HTTPS (no custom/proprietary encryption), so declare
          # it exempt. This auto-answers App Store Connect's export-compliance prompt on every
          # build — no manual "None of the above" click per upload. Injected here (not committed
          # in ios/) because the ios/ project is generated on CI, so it survives every cap sync.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

          # --- Stage 0 RoomPlan native plugin (PLAN-STAGE-0 §4) ---
          # No committed ios/ (no Mac), so the plugin's Swift lives in native/ios/ and is injected
          # here. We APPEND the class bodies into the generated AppDelegate.swift — which is always in
          # the target's compile sources — rather than dropping loose files into the project, which
          # would NOT be compiled without editing project.pbxproj (or would depend on Xcode-16
          # synchronized-group behavior we can't verify blind). Imports go to the top; class bodies to
          # the bottom. Registration is by hand via a CAPBridgeViewController subclass, so we also
          # repoint the storyboard's root controller at it (fail loudly if the format drifted).
          APPDELEGATE="ios/App/App/AppDelegate.swift"
          for imp in Foundation RoomPlan; do
            if ! grep -qx "import $imp" "$APPDELEGATE"; then
              printf 'import %s\n' "$imp" | cat - "$APPDELEGATE" > "$APPDELEGATE.tmp"
              mv "$APPDELEGATE.tmp" "$APPDELEGATE"
            fi
          done
          for f in native/ios/RoomPlanPlugin.swift native/ios/MainViewController.swift; do
            printf '\n' >> "$APPDELEGATE"
            grep -v '^import ' "$f" >> "$APPDELEGATE" || true
          done
          STORYBOARD="ios/App/App/Base.lproj/Main.storyboard"
          sed -i '' 's#customClass="CAPBridgeViewController" customModule="Capacitor"#customClass="MainViewController" customModule="App" customModuleProvider="target"#' "$STORYBOARD"
          grep -q 'customClass="MainViewController"' "$STORYBOARD" || { echo "ERROR: Main.storyboard root-controller patch did not apply — RoomPlan plugin would not register."; exit 1; }

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          AUTH=(-authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Capacitor 8 uses SPM (App.xcodeproj); older/CocoaPods setups produce a workspace.
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            CONTAINER=(-project ios/App/App.xcodeproj)
          fi

          # Archive WITHOUT signing (CODE_SIGNING_ALLOWED=NO). Why: automatic signing at archive
          # time picks an "Apple Development" identity, and a development provisioning profile
          # requires >=1 registered device on the team. This account has none — which is exactly
          # what failed the first run ("requires an iOS App Development profile"). An unsigned
          # archive needs no profile at all. Distribution signing is deferred to the export step,
          # where an App Store profile (which carries NO device list) is generated on demand — so
          # no device ever needs to be registered. Verified against current Capacitor 8 / Xcode 26
          # CI guidance (PLAN-STAGE-0 §7's budgeted signing iteration). If a future runner rejects
          # exporting an unsigned archive, the fallback is to register one device UDID and restore
          # automatic development signing here — but distribution-at-export is the cleaner pattern.
          # IPHONEOS_DEPLOYMENT_TARGET=17.0: the only device is on iPadOS 26, and RoomPlan needs
          # iOS 16 (StructureBuilder 17), so target 17 lets the plugin use the API without
          # per-call availability guards (PLAN-STAGE-0 §2).
          xcodebuild archive \
            "${CONTAINER[@]}" -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO

          # signingStyle=automatic tells exportArchive to cloud-sign for distribution using the
          # ASC API key (-allowProvisioningUpdates below) — it creates/downloads the App Store
          # distribution certificate + profile and re-signs the app during export.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates "${AUTH[@]}"
