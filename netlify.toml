# Netlify configuration: build, the review function, and the same-origin /api/* path.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/review"
  to = "/.netlify/functions/review"
  status = 200
